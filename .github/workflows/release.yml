name: Publish Skill
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s skills/demand-workbench-archive/scripts -p 'test_*.py'
      - run: python3 tools/package_skill.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/demand-workbench-archive.zip dist/SHA256SUMS --title "构想台问答归档 $GITHUB_REF_NAME" --generate-notes
